name: "Sync Upstream"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/mc1arke/sonarqube-community-branch-plugin.git
      OVERRIDE_PATHS: |
        .github
        patches

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_PAT }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stash override-paths from current master
        run: |
          mkdir -p "$RUNNER_TEMP/overrides"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            dest="$RUNNER_TEMP/overrides/$path"
            mkdir -p "$(dirname "$dest")"
            cp -r "$path" "$dest"
            echo "Stashed: $path"
          done <<< "$OVERRIDE_PATHS"

      - name: Fetch upstream remote
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --force "refs/tags/*:refs/upstream-tags/*" "refs/heads/*:refs/upstream-heads/*"

      - name: Checkout latest upstream tag
        run: |
          UPSTREAM_TAG=$(git for-each-ref --sort=-version:refname --format='%(refname:strip=2)' 'refs/upstream-tags/*' | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' | head -n 1)
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::error::No upstream tag"
            exit 1
          fi
          echo "UPSTREAM_TAG: $UPSTREAM_TAG"
          git checkout --detach "refs/upstream-tags/$UPSTREAM_TAG"

      - name: Restore override-paths
        run: |
          if [ -d "$RUNNER_TEMP/overrides" ]; then
            cp -r "$RUNNER_TEMP/overrides/." .
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Restore overrides"
            fi
          fi

      - name: Reset version to snapshot
        run: |
          RELEASE_VERSION=$(sed -n 's/^version=//p' gradle.properties)
          if ! echo "$RELEASE_VERSION" | grep -qE '^[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "::error::Unexpected version: $RELEASE_VERSION"
            exit 1
          fi
          SNAPSHOT_VERSION=$(echo "$RELEASE_VERSION" | awk -F. '{print $1 "." $2 + 1 ".0-SNAPSHOT"}')
          echo "SNAPSHOT_VERSION: $SNAPSHOT_VERSION"
          sed -i "s/^version=.*/version=$SNAPSHOT_VERSION/" gradle.properties
          sed -i "s/^PLUGIN_VERSION=.*/PLUGIN_VERSION=$SNAPSHOT_VERSION/" .env
          sed -i "s/^DOCKERFILE=.*/DOCKERFILE=Dockerfile/" .env
          git add -A
          git commit -m "Return to SNAPSHOT version post release"

      - name: Apply patches
        run: |
          shopt -s nullglob
          patches=(patches/*.patch)
          IFS=$'\n' sorted=($(sort <<<"${patches[*]}")); unset IFS
          git am --3way --ignore-whitespace "${sorted[@]}"

      - name: Force-push to master
        run: |
          git push --force-with-lease origin "HEAD:refs/heads/master"
